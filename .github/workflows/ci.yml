# CI/CD pipeline implementing the six blocking gates (project sheet §6, D7).
#
# Branch protection (GitHub repo settings, enabled when the team repo is created):
#   - require status check "blocking-gates" to pass before merge;
#   - safety-critical paths (src/contentguard/policy/**, invariant-named files)
#     additionally require human review with an architecture decision (CODEOWNERS/review rule).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  blocking-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest ruff mypy pyyaml jsonschema

      # ---------------- Gate 2 — static analysis (every commit) ----------------
      - name: "Gate 2a — lint (ruff)"
        run: ruff check src scripts test

      - name: "Gate 2b — type check (mypy)"
        run: mypy --ignore-missing-imports scripts test

      # ---------------- Gate 3 — schema (registry validity) --------------------
      - name: "Gate 3 — requirements registry validates against its JSON schema"
        run: python scripts/validate_requirements.py

      # ---------------- Gate 5 — regression (all prior suites) -----------------
      - name: "Gate 5 — regression: full deterministic suite"
        run: pytest test/offline -v

      # ---------------- Gate 1 — test approval (PRs only) ----------------------
      - name: "Gate 1 — test plan approved before implementation"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_test_approval.py

      # ---------------- Gate 4 — semantic evaluation (PRs only) ----------------
      - name: "Gate 4 — semantic evaluation for prompt/model changes"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_semantic_eval.py

      # ---------------- Gate 6 — AI-use log (PRs only) -------------------------
      - name: "Gate 6 — AI-use log updated for code/prompt changes"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_ai_use_log.py

      # ---------------- Gate 7 — review memo (PRs only) ------------------------
      - name: "Gate 7 — review memo present (PRs only)"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_review_memo.py
