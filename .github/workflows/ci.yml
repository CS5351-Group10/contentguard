# CI/CD pipeline implementing the six blocking gates (project sheet §6, D7).
#
# Branch protection (GitHub repo settings, enabled when the team repo is created):
#   - require status check "blocking-gates" to pass before merge;
#   - safety-critical paths (src/contentguard/policy/**, invariant-named files)
#     additionally require human review with an architecture decision (CODEOWNERS/review rule).
#
# The job name "blocking-gates" is depended on by branch protection — do not rename it.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  blocking-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Single source of truth for the toolchain (TD-8): the manifest is what CI reads.
      - name: Install dependencies (from requirements.txt)
        run: pip install -r requirements.txt

      # ---------------- Gate 2 — static analysis (every commit) ----------------
      - name: "Gate 2a — lint (ruff)"
        run: ruff check src scripts test

      - name: "Gate 2b — type check (mypy)"
        run: mypy --ignore-missing-imports scripts test

      # Gate 2, dependency tier (TD-8): manifest declares the toolchain + pip check.
      - name: "Gate 2c — dependency manifest and pip check"
        run: python scripts/check_dependencies.py

      # Gate 2, safety-path tier (partial TD-4): a PR touching a safety path must cite an
      # ADR/invariant. Contract diff, API-surface diff and the structural call-graph check
      # are NOT implemented yet (TODO(TD-4) in scripts/check_safety_paths.py) — they are
      # deliberately absent here rather than present as PASS-without-checking steps.
      - name: "Gate 2d — safety-path tier (ADR/invariant reference)"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_safety_paths.py

      # Gate 2, structural tier (TD-4, REQ-INV-001): module-set vs ADR-001 (undeclared
      # directory FAIL, declared-but-absent element INFO), element import cycles, the
      # frozen-path guard (.opencode/** and .agent/** only — never transcripts/**), and a
      # docs-only pass. The INV-1 enforcement scan and dependency direction stay in gate 5;
      # this gate does not re-run them. On a PR the step fails closed if GITHUB_TOKEN is
      # missing rather than silently skipping.
      - name: "Gate 2e — structural checks"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_structural.py

      # ---------------- Gate 3 — schema (registry validity) --------------------
      - name: "Gate 3 — requirements registry validates against its JSON schema"
        run: python scripts/validate_requirements.py

      # ---------------- Gate 5 — regression (all prior suites) -----------------
      - name: "Gate 5 — regression: full deterministic suite"
        run: pytest test/offline -v

      # ---------------- Gate 1 — test approval (PRs only) ----------------------
      - name: "Gate 1 — test plan approved before implementation"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_test_approval.py

      # ---------------- Gate 4 — semantic evaluation (PRs only) ----------------
      # BLOCKING (--strict, TD-1): a prompt/model change with no replay artifact or one
      # below the approved thresholds fails the merge. The replay is produced by a human
      # (scripts/record_replay.py) and committed under test/eval/replay/<tag>.jsonl; CI
      # replays recorded output only and never calls a provider. Docs-only PRs are
      # unaffected — the gate passes when no prompt/model path changes.
      - name: "Gate 4 — semantic evaluation for prompt/model changes"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_semantic_eval.py --strict

      # ---------------- Gate 6 — AI-use log (PRs only) -------------------------
      - name: "Gate 6 — AI-use log updated for code/prompt changes"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_ai_use_log.py
