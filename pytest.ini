[pytest]
# TD-3 regeneration (issue #42). Pin rootdir to this repository and scope default
# collection to the deterministic tier only. Gate 5 (regression) runs
# `pytest test/offline -v` explicitly; a bare `pytest` must not walk into test/live
# (network + provider keys) or up into a parent course config.
testpaths = test/offline
addopts = -ra
