# ContentGuard Requirements Registry v1.0 — proposed first formal edition.
# Pending team approval; requires the proposed schema change for CI compatibility.
project: ContentGuard
version: '1.0'
requirements:
  - id: REQ-INV-001
    type: invariant
    title: AI output never executes enforcement
    statement: Only the deterministic policy engine shall authorize and effect consequential moderation actions. 
      Every model, moderator, and automated action request is subject to that boundary and its mandatory safety 
      rules.
    fit_criterion: Using the approved catalogue of protected actions and entry points, attempt a forged model action,
      direct non-policy call, background/replay action and authorized moderator request contrary to a mandatory rule.
      Assert no protected state change or external effect. A valid engine-authorized action on an eligible case 
      succeeds. Review each privileged entry point for mediation.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: structural-check
      evidence: PENDING
    enforcing_component: policy engine (deterministic)
    fallback: Block merge on a boundary bypass. Disable the affected enforcement path until its authorization can be 
      enforced.
    zero_tolerance: true

  - id: REQ-INV-002
    type: invariant
    title: Fail-safe hold on AI unavailability
    statement: When AI analysis of an accepted submission is unavailable, timed out, or invalid, the system shall 
      retain it for human review with no automatic approval or rejection. It shall report confirmed queue placement 
      only when the handoff is durably established.
    fit_criterion: Inject provider error, timeout, malformed JSON, missing fields and invalid enums. With a working 
      queue each reaches human review without auto-disposition. For definitive write failure, report failed or safely
      pending for recovery under the approved contract. For uncertain write outcome, report unconfirmed until 
      reconciled. If a durable write succeeds but its acknowledgment is lost, retry of the same logical submission 
      resolves to the same case and yields at most one review entry. No variant effects automatic approval or 
      rejection.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: unit-test
      evidence: PENDING
    enforcing_component: escalation (human review queue)
    fallback: Prevent automatic disposition. Report definitive failure or unconfirmed handoff accurately. Reconcile 
      uncertain or lost responses to the existing logical case and recover the pending review without duplicate 
      effects.
    zero_tolerance: true

  - id: REQ-INV-003
    type: invariant
    title: High-severity content always reaches human review
    statement: An accepted item marked high severity by a valid AI response or an applicable deterministic pre-filter
      shall have substantive authorized human review recorded for the applicable case state before any final 
      disposition, with the final action still subject to the deterministic policy authority.
    fit_criterion: Cross each high-severity source with allow, review, violate, and policy allow. Verify queue entry 
      when available and zero final effects before a review record from an authorized reviewer for the current 
      relevant case state. A forged or stale review record does not satisfy the gate. After a valid recorded review, 
      a permitted policy action succeeds and a mandatory-rule violation is blocked. Approval defines required review 
      evidence and its invalidation conditions.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: unit-test
      evidence: PENDING
    enforcing_component: policy engine routing rules
    fallback: Suppress final automatic disposition and surface the case for operator recovery when normal handoff 
      fails.
    zero_tolerance: true

  - id: REQ-INV-004
    type: invariant
    title: Every decision leaves an audit record
    statement: Every committed moderation decision shall have exactly one associated audit record with content hash, 
      policy rule or fallback identifier, recorded outcome, timestamp, applicable actor identifiers and AI verdict 
      when available. An externally effective consequential disposition shall have a durable corresponding audit 
      record; records for incomplete attempts shall not represent a committed result.
    fit_criterion: Verify one record for normal, missing-AI, and human decisions. If audit write fails or is 
      uncertain, no consequential action becomes effective or is acknowledged as committed absent durable audit. If 
      the audit write succeeds but authoritative state update fails, do not present the attempt as committed or 
      activate its protected effect. For lost responses or uncertain external effects, reconcile before retry rather 
      than risking a duplicate action. The same logical decision yields at most one effective disposition and one 
      committed record. Opposite decisions on the same logical case state cannot both take effect; an authorized 
      successor needs valid state and a fresh record.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING
    enforcing_component: audit subsystem
    fallback: Suppress external action and committed acknowledgment without durable audit. Keep incomplete audit 
      attempts distinguishable from committed decisions. Reconcile before retrying any action of uncertain outcome.
    zero_tolerance: true

  - id: REQ-INV-005
    type: invariant
    title: Prompt/model changes pass semantic evaluation before production
    statement: A runtime prompt or model configuration change shall be blocked from merging unless the fixed semantic
      evaluation replay meets the approved release criteria.
    fit_criterion: With the approved map of effective prompt/model inputs, exercise applicable changes including 
      model selection outside conventional filenames. Missing, incomplete, stale or wrong-revision replay, 
      unavailable runner, failed minimum metric or safety escapes above the approved maximum block merge. A passing 
      replay is bound to the effective prompt, model/config, corpus, rubric and evaluated revision. Unrelated changes
      do not require semantic replay.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: ci-gate
      evidence: PENDING
    enforcing_component: CI semantic evaluation gate
    fallback: Hold the merge if replay evidence is absent or unacceptable. If it has shipped, restore the last 
      approved prompt and model configuration and record the incident.
    zero_tolerance: true

  - id: REQ-FUN-001
    type: functional
    title: Content submission intake
    statement: For a successfully completed text triage, the API shall return one outcome and an audit identifier 
      resolvable to the corresponding decision by an authorized lookup. For incomplete or uncertain triage or queue 
      handoff, the API shall communicate the known state without claiming success.
    fit_criterion: Exercise ordinary and high-severity triage, provider failure with durable handoff, definitive 
      queue failure, unknown handoff and lost response after durable success. A successful response returns a 
      matching audit ID. Incomplete and uncertain results must not appear successful. Replay the same logical 
      submission under the approved retry contract and verify reconciliation without duplicate queue work or effects.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-FUN-002
    type: functional
    title: AI advisory analysis
    statement: For each accepted item, the system shall attempt LLM moderation analysis and pass a valid verdict, 
      severity and rationale to policy evaluation as advisory data.
    fit_criterion: For accepted content on the live analysis path, a real configured LLM is invoked and the model 
      identity, contract version and advisory response are recorded in test evidence. Offline contract fixtures admit
      only a valid response to policy evaluation; provider failure, invalid shape, wrong types and invalid enums 
      enter the fallback. The live evidence and offline contract check are separate.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: unit-test
      evidence: PENDING

  - id: REQ-FUN-003
    type: functional
    title: Human review queue
    statement: The system shall make successfully queued held and escalated items available for review and accept 
      disposition requests from authorized moderators through the policy boundary. A submitted review request does 
      not itself grant an enforcement action.
    fit_criterion: Use held and escalated cases. Verify an allowed moderator disposition commits through the engine 
      and is attributable. Verify an unauthorized, stale, or mandatory-rule-violating request has no consequential 
      effect. Confirm the permitted outcome and override table before signing off workflow coverage.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-FUN-004
    type: functional
    title: Policy justification
    statement: The system shall attribute an accepted content decision to the applicable policy or fallback reason 
      and preserve that attribution when policy changes.
    fit_criterion: Exercise an approved policy match and a fallback. Each committed record has the expected reason. 
      Activate a new policy snapshot through the supported policy-change mechanism; retrieval of the old decision 
      still returns its original identifiers.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-FUN-005
    type: functional
    title: Retrieval grounding
    statement: Dynamic policy retrieval remains a provisional Should, subject to explicit MVP scope approval. If 
      adopted, every clause used from retrieval shall be attributable to the approved policy snapshot for the case, 
      and retrieval data shall carry no enforcement authority.
    fit_criterion: If adopted, exercise a known clause, fabricated clause, stale snapshot, conflicting evidence and 
      no match. Only usable evidence with correct provenance may be used as approved policy context. All others 
      follow the approved fallback. Capture the adopted scope and exact fallback contract before acceptance.
    priority: should
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-FUN-006
    type: functional
    title: Appeal intake
    statement: Appeal deferral remains a provisional Won’t for MVP, pending PM or team ratification. If adopted, each
      accepted appeal and disposition shall link to the original moderation decision without changing that historical
      record.
    fit_criterion: Inspect the recorded scope decision before treating appeal deferral as final. If adopted, verify 
      authorized appeal and disposition resolve the original unchanged record and use the existing review and 
      enforcement authority. Unknown decisions and unauthorized actors create no appeal.
    priority: wont
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-FUN-007
    type: functional
    title: Demo comparison controls
    statement: The team shall demonstrate comparable baseline and enhanced behavior as required by the project 
      instructions. Runtime safety constraints shall remain in force whenever an actual enforcement path is enabled.
    fit_criterion: Run the same input in each demo condition and identify requirements, configuration and observable 
      outcome. If showing behavior that would violate a safety boundary, use a read-only or isolated simulation and 
      verify no real effect.
    priority: should
    changed_date: '2026-11-16'
    verification:
      method: manual-review
      evidence: PENDING

  - id: REQ-SEC-001
    type: security
    title: Untrusted analysis inputs
    statement: The system shall keep submitted text and any retrieved policy text from granting authority or write 
      privileges to the model.
    fit_criterion: Run direct and, when retrieval is enabled, indirect injections requesting privileged tools, 
      fabricated policy citations, or schema-valid malicious recommendations. Assert zero unauthorized effects and no
      privilege change. For forged citations check the authorized policy snapshot contract when retrieval is used.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-SEC-002
    type: security
    title: Validate submission boundary
    statement: The system shall reject unsupported or malformed submission data at intake before asking the LLM for 
      analysis.
    fit_criterion: Supply malformed request data, absent required text and unsupported input type. For each case 
      assert controlled rejection and zero model calls. After input limits are approved, exercise their exact 
      boundary and one unit above.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: unit-test
      evidence: PENDING

  - id: REQ-SEC-003
    type: security
    title: Moderator authorization
    statement: Only an authorized moderator shall be able to submit a human disposition through the review pathway.
    fit_criterion: Use authorized and unauthorized identities against the same case, including a valid moderator 
      lacking the case grant where scoped review applies. Change only identity or case grant. Unauthorized requests 
      are denied before enforcement and leave the case and external effects unchanged.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-SEC-004
    type: security
    title: Privacy and evidence access
    statement: The system shall restrict decision evidence according to a team-approved access and retention policy.
    fit_criterion: After lifecycle and access rules are approved, compare owner, assigned moderator and unauthorized 
      requests. Verify authorized access and denial fields, then use a controlled clock to verify action on each 
      artifact at its approved retention boundary.
    priority: should
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-SEC-005
    type: security
    title: Exclude submission credentials
    statement: The submission archive shall exclude API keys and other credentials.
    fit_criterion: Inspect the staged submission and scan for known secret formats and seeded dummy credentials; the 
      release archive contains zero valid credentials and the dummy-bearing archive is rejected by the agreed review 
      process.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: manual-review
      evidence: PENDING

  - id: REQ-QUA-001
    type: quality
    title: Deterministic repeatability
    statement: The policy boundary shall produce the same outcome and reason with the same validated inputs, 
      applicable authoritative state and policy revision.
    fit_criterion: Repeat and reorder policy evaluations using fixed fixtures. For identical complete 
      input/state/revision tuples the outcome and reason have zero mismatches; separately verify that metadata such 
      as timestamps can differ.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: unit-test
      evidence: PENDING

  - id: REQ-QUA-002
    type: quality
    title: Conflicting moderation writes
    statement: If concurrent moderation or retry workflows are adopted, the team shall define legal successor 
      transitions, replay identity, and reconciliation behavior for uncertain responses. The mandatory 
      no-duplicate-effect, no-stale-conflict and no-false-success boundaries in REQ-INV-002, REQ-INV-004 and 
      REQ-FUN-001 apply wherever these situations can occur.
    fit_criterion: Exercise two opposite actions on one case revision, duplicate delivery, lost acknowledgment, and 
      missing audit or state write. Check both response and outcome against the approved transition/replay contract. 
      No duplicate committed decision or side effect, conflicting commit on the same version, or false success is 
      permitted.
    priority: should
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-QUA-003
    type: quality
    title: Report semantic evaluation by slice
    statement: The evaluation report should expose false-positive and false-negative counts by approved policy 
      category and selected context slices, using label definitions and denominators fixed before the run.
    fit_criterion: Replay a fixed labeled set. For each slice report evaluation unit, reference labels, agreement 
      policy, false positives over expected negatives, and false negatives over expected positives. Report empty 
      denominators as unavailable and preserve disagreement/coverage notes. Targets require approval.
    priority: should
    changed_date: '2026-11-16'
    verification:
      method: live-test
      evidence: PENDING

  - id: REQ-PER-001
    type: performance
    title: Measure end-to-end latency
    statement: The team should characterize elapsed time from accepted intake to an observable confirmed triage 
      response or unconfirmed/failure response over a documented workload. Any latency SLO requires separate 
      approval.
    fit_criterion: Record timing anchors, elapsed milliseconds, sample count, workload, provider/model and test 
      environment. Report disjoint groups for normal completion, fallback completion and unresolved/failure. Tag 
      provider timeouts separately and report them as a slice. Publish quantiles and timeout/failure counts with 
      denominators. A performance threshold is pending workload and SLO approval.
    priority: could
    changed_date: '2026-11-16'
    verification:
      method: live-test
      evidence: PENDING

  - id: REQ-COS-001
    type: cost
    title: Account for provider usage
    statement: The team should record provider-reported input and output tokens per invocation attempt, including 
      retries, and mark unavailable values unknown. Any token budget or cost cap requires separate approval.
    fit_criterion: Use pinned responses for normal, retried, and missing-usage attempts. Reconcile input and output 
      tokens separately to provider-reported units. Record each attempt once, aggregate known amounts by logical 
      request, and report unknown-attempt count separately. Budget scope and target need explicit approval.
    priority: could
    changed_date: '2026-11-16'
    verification:
      method: integration-test
      evidence: PENDING

  - id: REQ-GOV-001
    type: governance
    title: OpenCode implementation provenance
    statement: Implementation changes shall have traceable OpenCode session evidence and recorded human supervision.
    fit_criterion: For a sampled code or test change, trace paths and commit to the corresponding session, human plan
      approval and AI-use-log entry. A missing evidence link fails review.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: manual-review
      evidence: PENDING

  - id: REQ-GOV-002
    type: governance
    title: Approve tests before implementation
    statement: The team shall record human test-plan approval before implementing a covered change.
    fit_criterion: For a code PR, verify the referenced issue exists and has explicit human approval preceding the 
      first implementation commit. Missing, fake and late approval fixtures fail the acceptance check.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: ci-gate
      evidence: PENDING

  - id: REQ-GOV-003
    type: governance
    title: Validate the registry
    statement: The registry shall pass validation against the repository requirement schema before merge.
    fit_criterion: The unchanged gate 3 validator accepts the candidate registry and rejects a disposable fixture 
      missing a required invariant fallback.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: ci-gate
      evidence: PENDING

  - id: REQ-GOV-004
    type: governance
    title: Trace acceptance evidence
    statement: Each baselined requirement shall trace to its source, accountable architectural responsibility and 
      verification evidence. Gate and test design evidence shall be identifiable separately from execution evidence.
    fit_criterion: Confirm exact ID correspondence between the adopted registry and the authoritative Architecture 
      matrix. Each baselined row has an origin, role and criterion. At implementation acceptance, verify test 
      references cite IDs, and each invariant has an executed negative case whose result would expose a violation.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: structural-check
      evidence: PENDING

  - id: REQ-GOV-005
    type: governance
    title: Protect safety-critical changes
    statement: Safety-critical implementation changes shall have an approved ADR and explicit human approval.
    fit_criterion: Match the policy change to an accepted ADR and named approval in the PR record. A path change 
      without the ADR or required approval is rejected before merge.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: manual-review
      evidence: PENDING

  - id: REQ-GOV-006
    type: governance
    title: Run static checks
    statement: The CI pipeline shall block a proposed change that fails the required lint or type checks.
    fit_criterion: Run workflow fixtures producing one lint error and one type error separately. The required check 
      fails each time. A clean comparison succeeds.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: ci-gate
      evidence: PENDING

  - id: REQ-GOV-007
    type: governance
    title: Block offline regressions
    statement: The CI pipeline shall block changes that regress the offline suite.
    fit_criterion: Inject a known offline failure into an isolated change. The required CI check fails. Successful 
      rerun of the full preceding offline suite produces zero failures without network access.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: ci-gate
      evidence: PENDING

  - id: REQ-GOV-008
    type: governance
    title: Correlate AI-use changes
    statement: Covered implementation PRs, including applicable workflow changes, shall include a corresponding 
      AI-use-log entry in the same change.
    fit_criterion: For a covered code or workflow-only PR, verify an absent log update blocks. Review rejects an 
      unrelated or empty log change. An acceptable entry links the actual session, relevant paths and change scope.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: ci-gate
      evidence: PENDING

  - id: REQ-GOV-009
    type: governance
    title: Protect main using required checks
    statement: The team shall require the blocking CI check and applicable review through main-branch protection.
    fit_criterion: Inspect hosted repository settings and CI requirements. With authorized hosted evidence, verify a 
      failing required check blocks even with review, and missing required review blocks even with passing checks. 
      Record any bypass authority. Read-only analysis may identify configuration intent but cannot establish hosted 
      enforcement.
    priority: must
    changed_date: '2026-11-16'
    verification:
      method: manual-review
      evidence: PENDING
